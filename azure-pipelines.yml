# ============================================================
# azure-pipelines.yml
# Author  : Sanke Wadbudhe
# Project : DemoAzApp - Azure Function App
# ============================================================

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.x'
  projectPath: 'DemoAzApp/DemoAzApp.csproj'

stages:

# ── CI: Build ────────────────────────────────────────────────
- stage: Build
  displayName: 'CI — Build and Publish'
  jobs:
  - job: BuildJob
    steps:

    - task: UseDotNet@2
      displayName: 'Install .NET 8'
      inputs:
        version: $(dotnetVersion)

    - task: DotNetCoreCLI@2
      displayName: 'Restore packages'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: $(projectPath)
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Publish'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: $(projectPath)
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: PublishPipelineArtifact@1
      displayName: 'Upload artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'

# ── CD: Deploy to Dev ────────────────────────────────────────
- stage: DeployDev
  displayName: 'CD — Deploy to Dev'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToDev
    environment: 'dev'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download artifact'
            inputs:
              artifactName: 'drop'
              targetPath: '$(Pipeline.Workspace)/drop'

          - task: AzureFunctionApp@2
            displayName: 'Deploy to dotnetprotfilo'
            inputs:
              azureSubscription: 'azure-sc'
              appType: 'functionApp'
              appName: 'dotnetprotfilo'
              package: '$(Pipeline.Workspace)/drop/**/*.zip'
              deploymentMethod: 'auto'
